<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeadFlow Recovery</title>
<style>
:root{--ink:#1f2a33;--mute:#66737d;--bg:#f4f5f3;--card:#fff;--line:#e2e5e1;--acc:#1f6f6b;--acc2:#e6f1f0;--red:#b3402f;--amb:#b7791f;--r:10px}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);background:var(--bg);display:flex;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
aside{width:230px;background:#1b2a30;color:#dfe8e6;padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{font-size:18px;font-weight:700;padding:0 10px 18px;color:#fff}
.logo small{display:block;font-weight:400;font-size:12px;color:#9fb3b0}
nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px;border-radius:8px;cursor:pointer}
nav button:hover{background:#26393f}
nav button.on{background:var(--acc);color:#fff}
.badge{background:var(--red);color:#fff;border-radius:99px;font-size:12px;padding:0 8px}
.reset{margin-top:auto;background:none;border:1px solid #3a4f55;color:#9fb3b0;border-radius:8px;padding:8px;cursor:pointer;font-size:13px}
main{flex:1;padding:28px;max-width:1100px;min-width:0}
h1{font-size:24px;margin-bottom:4px}
.sub{color:var(--mute);margin-bottom:22px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.del{background:#fff;color:var(--red);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:13px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat b{display:block;font-size:28px;line-height:1.1}
.stat span{color:var(--mute);font-size:13px}
.stat.warn b{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel h2{font-size:16px;margin-bottom:12px}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.bar i{flex:1;height:8px;background:var(--bg);border-radius:9px;overflow:hidden}
.bar u{display:block;height:100%;background:var(--acc);border-radius:9px}
.bar em{font-style:normal;width:130px}.bar s{text-decoration:none;width:22px;text-align:right}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item small{display:block;color:var(--mute)}
.late{color:var(--red);font-weight:600}.today{color:var(--amb);font-weight:600}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tools input,.tools select,dialog input,dialog select,dialog textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
.tools input{flex:2;min-width:200px;width:auto}.tools select{flex:1;min-width:140px;width:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--mute);font-weight:600;background:#fafbf9}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--acc2);color:var(--acc);white-space:nowrap}
.s-Nuevo{background:#e8eefb;color:#2c4f9e}.s-Contactado{background:#fdf1dc;color:#8a5a0c}
.s-Presupuesto\ enviado{background:#efe6f8;color:#6b3a96}.s-En\ seguimiento{background:var(--acc2);color:var(--acc)}
.s-Cerrado{background:#e9ebe8;color:#505a52}
.acts{display:flex;gap:6px;justify-content:flex-end}
.empty{text-align:center;color:var(--mute);padding:30px}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,94vw);max-height:92vh;box-shadow:0 20px 60px #0004}
dialog::backdrop{background:#0006}
form{padding:22px;display:grid;gap:12px;grid-template-columns:1fr 1fr}
form h2{grid-column:1/-1;font-size:19px}
form label{font-size:13px;color:var(--mute);display:grid;gap:4px}
.full{grid-column:1/-1}
.notes{max-height:140px;overflow:auto;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.notes p{padding:4px 0;border-bottom:1px dashed var(--line)}.notes p:last-child{border:0}
.notes small{color:var(--mute)}
.foot{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
@media(max-width:760px){
 body{flex-direction:column}
 aside{width:100%;height:auto;position:static;flex-direction:row;align-items:center;padding:10px;gap:4px;overflow-x:auto}
 .logo{padding:0 8px 0 4px;white-space:nowrap;font-size:16px}.logo small{display:none}
 nav{display:flex;gap:4px}nav button{white-space:nowrap;gap:8px}
 .reset{display:none}
 main{padding:16px}
 .grid2{grid-template-columns:1fr}
 table,thead,tbody,tr,td{display:block}thead{display:none}
 table{background:none;border:0}
 tr{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;padding:8px 12px}
 td{border:0;padding:4px 0}
 td[data-l]::before{content:attr(data-l)": ";color:var(--mute);font-size:13px}
 .acts{justify-content:flex-start;margin-top:6px}
 form{grid-template-columns:1fr}
}
</style>
</head>
<body>
<aside>
 <div class="logo">LeadFlow Recovery<small>CRM para reformas</small></div>
 <nav>
  <button data-v="dash" class="on">Panel</button>
  <button data-v="clients">Clientes</button>
  <button data-v="tasks">Tareas <span class="badge" id="tb" hidden></span></button>
 </nav>
 <button class="reset" id="reset">Restaurar datos de demo</button>
</aside>
<main id="main"></main>

<dialog id="dlg">
 <form id="f" method="dialog">
  <h2 id="ft">Nuevo cliente</h2>
  <label class="full">Nombre<input id="name" required></label>
  <label>Teléfono<input id="phone" type="tel" required></label>
  <label>Localidad<input id="city" required></label>
  <label>Tipo de reforma<select id="type"></select></label>
  <label>Estado<select id="status"></select></label>
  <label class="full">Próximo seguimiento<input id="follow" type="date"></label>
  <div class="full" id="oldnotes" hidden><label>Notas anteriores</label><div class="notes" id="nl"></div></div>
  <label class="full">Añadir nota<textarea id="note" rows="2" placeholder="Ej.: Quiere cambiar la bañera por plato de ducha"></textarea></label>
  <div class="foot"><button type="button" class="btn sec" id="cancel">Cancelar</button><button class="btn" id="save">Guardar cliente</button></div>
 </form>
</dialog>

<script>
const STATUS=["Nuevo","Contactado","Presupuesto enviado","En seguimiento","Cerrado"];
const TYPES=["Baño","Cocina","Baño y cocina"];
const KEY="leadflow_recovery_v1";
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const inDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>s?new Date(s+"T00:00").toLocaleDateString("es-ES",{day:"numeric",month:"short"}):"—";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function demo(){
 const n=(t,d)=>[{text:t,date:inDays(d)}];
 return [
  {name:"Marta Gil Ortega",phone:"600 123 456",city:"Alcalá de Henares",type:"Baño",status:"Nuevo",follow:inDays(0),notes:n("Pide presupuesto para cambiar bañera por plato de ducha.",0)},
  {name:"Carlos Ruiz Pastor",phone:"611 222 333",city:"Getafe",type:"Cocina",status:"Contactado",follow:inDays(-2),notes:n("Llamada hecha. Quiere visita para medir la cocina.",-3)},
  {name:"Lucía Fernández",phone:"622 987 654",city:"Madrid",type:"Baño y cocina",status:"Presupuesto enviado",follow:inDays(2),notes:n("Presupuesto de 11.800 € enviado por email.",-1)},
  {name:"Familia Romero",phone:"633 456 789",city:"Leganés",type:"Cocina",status:"En seguimiento",follow:inDays(5),notes:n("Comparan con otra empresa. Llamar el viernes.",-4)},
  {name:"Javier Molina",phone:"644 321 098",city:"Fuenlabrada",type:"Baño",status:"Presupuesto enviado",follow:inDays(-1),notes:n("Duda por el precio de los azulejos.",-5)},
  {name:"Elena Navarro",phone:"655 777 888",city:"Alcorcón",type:"Baño",status:"Cerrado",follow:"",notes:n("Obra aceptada. Empieza en diciembre.",-6)},
  {name:"Pablo Sanz",phone:"666 010 203",city:"Móstoles",type:"Cocina",status:"Nuevo",follow:inDays(1),notes:[]},
  {name:"Inés Carrasco",phone:"677 404 505",city:"Torrejón de Ardoz",type:"Baño y cocina",status:"En seguimiento",follow:inDays(8),notes:n("Esperando licencia de la comunidad.",-2)}
 ].map(c=>({id:uid(),...c}));
}
let data;
try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!Array.isArray(data)){data=demo();save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}

let view="dash",q="",fs="",ft="",editId=null;
const tasks=()=>data.filter(c=>c.follow&&c.status!=="Cerrado").sort((a,b)=>a.follow.localeCompare(b.follow));
const pill=s=>`<span class="pill s-${esc(s)}">${esc(s)}</span>`;
const dateCls=d=>d<inDays(0)?"late":d===inDays(0)?"today":"";
const dateTxt=d=>d<inDays(0)?"Vencido · "+fmt(d):d===inDays(0)?"Hoy":fmt(d);

function taskRow(c){return `<div class="item"><div><b>${esc(c.name)}</b><small>${esc(c.type)} · ${esc(c.city)} · ${pill(c.status)}</small></div>
 <div style="text-align:right"><div class="${dateCls(c.follow)}">${dateTxt(c.follow)}</div>
 <button class="btn sm sec" data-a="done" data-id="${c.id}">Hecho</button></div></div>`}

function dash(){
 const t=tasks(),late=t.filter(c=>c.follow<inDays(0)).length,now=data.length;
 const cnt=s=>data.filter(c=>c.status===s).length;
 const stats=[["Clientes totales",now],["Nuevos",cnt("Nuevo")],["Presupuestos enviados",cnt("Presupuesto enviado")],["En seguimiento",cnt("En seguimiento")],["Cerrados",cnt("Cerrado")]]
  .map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("")
  +`<div class="stat ${late?"warn":""}"><b>${late}</b><span>Seguimientos vencidos</span></div>`;
 const bars=STATUS.map(s=>`<div class="bar"><em>${s}</em><i><u style="width:${now?cnt(s)/now*100:0}%"></u></i><s>${cnt(s)}</s></div>`).join("");
 const list=t.slice(0,5).map(taskRow).join("")||`<div class="empty">No hay seguimientos pendientes.</div>`;
 const rate=now?Math.round(cnt("Cerrado")/now*100):0;
 return `<div class="top"><div><h1>Panel</h1><p class="sub">Resumen de tus solicitudes y seguimientos.</p></div><button class="btn" data-a="new">Añadir cliente</button></div>
 <div class="stats">${stats}</div>
 <div class="grid2"><div class="panel"><h2>Clientes por estado</h2>${bars}<p class="sub" style="margin:12px 0 0">Tasa de cierre: ${rate}%</p></div>
 <div class="panel"><h2>Próximos seguimientos</h2>${list}</div></div>`;
}

function clients(){
 const L=data.filter(c=>(!fs||c.status===fs)&&(!ft||c.type===ft)&&(!q||[c.name,c.phone,c.city].join(" ").toLowerCase().includes(q.toLowerCase())));
 const rows=L.map(c=>`<tr><td data-l="Nombre"><b>${esc(c.name)}</b></td><td data-l="Teléfono"><a href="tel:${esc(c.phone.replace(/\s/g,""))}">${esc(c.phone)}</a></td>
 <td data-l="Localidad">${esc(c.city)}</td><td data-l="Reforma">${esc(c.type)}</td><td>${pill(c.status)}</td>
 <td data-l="Seguimiento"><span class="${c.status!=="Cerrado"&&c.follow?dateCls(c.follow):""}">${fmt(c.follow)}</span></td>
 <td data-l="Notas">${c.notes.length}</td>
 <td><div class="acts"><button class="btn sm sec" data-a="edit" data-id="${c.id}">Editar</button><button class="btn sm del" data-a="del" data-id="${c.id}">Eliminar</button></div></td></tr>`).join("");
 const opts=(a,sel)=>a.map(x=>`<option ${x===sel?"selected":""}>${x}</option>`).join("");
 return `<div class="top"><div><h1>Clientes</h1><p class="sub">${L.length} de ${data.length} clientes</p></div><button class="btn" data-a="new">Añadir cliente</button></div>
 <div class="tools"><input id="q" type="search" placeholder="Buscar por nombre, teléfono o localidad" value="${esc(q)}">
 <select id="fs"><option value="">Todos los estados</option>${opts(STATUS,fs)}</select>
 <select id="ft"><option value="">Todas las reformas</option>${opts(TYPES,ft)}</select></div>
 ${L.length?`<table><thead><tr><th>Nombre</th><th>Teléfono</th><th>Localidad</th><th>Reforma</th><th>Estado</th><th>Seguimiento</th><th>Notas</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
 :`<div class="panel empty">No hay clientes con estos filtros. Prueba a cambiar la búsqueda o añade uno nuevo.</div>`}`;
}

function tasksView(){
 const t=tasks(),g=(f)=>t.filter(f).map(taskRow).join("")||`<div class="empty">Nada por aquí.</div>`,td=inDays(0);
 return `<h1>Tareas pendientes</h1><p class="sub">Seguimientos programados de clientes sin cerrar.</p>
 <div class="panel" style="margin-bottom:16px"><h2>Vencidas</h2>${g(c=>c.follow<td)}</div>
 <div class="panel" style="margin-bottom:16px"><h2>Hoy</h2>${g(c=>c.follow===td)}</div>
 <div class="panel"><h2>Próximas</h2>${g(c=>c.follow>td)}</div>`;
}

function render(){
 const keep=document.activeElement&&document.activeElement.id==="q";
 $("#main").innerHTML={dash,clients,tasks:tasksView}[view]();
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
 const late=tasks().filter(c=>c.follow<=inDays(0)).length;
 $("#tb").hidden=!late;$("#tb").textContent=late;
 if(keep){const i=$("#q");i.focus();i.setSelectionRange(i.value.length,i.value.length)}
}

function openForm(id){
 editId=id;const c=data.find(x=>x.id===id)||{};
 $("#type").innerHTML=TYPES.map(x=>`<option>${x}</option>`).join("");
 $("#status").innerHTML=STATUS.map(x=>`<option>${x}</option>`).join("");
 $("#ft").textContent=id?"Editar cliente":"Nuevo cliente";
 $("#name").value=c.name||"";$("#phone").value=c.phone||"";$("#city").value=c.city||"";
 $("#type").value=c.type||TYPES[0];$("#status").value=c.status||STATUS[0];
 $("#follow").value=c.follow||"";$("#note").value="";
 $("#oldnotes").hidden=!(c.notes&&c.notes.length);
 $("#nl").innerHTML=(c.notes||[]).slice().reverse().map(n=>`<p>${esc(n.text)}<br><small>${fmt(n.date)}</small></p>`).join("");
 $("#dlg").showModal();$("#name").focus();
}

$("#f").addEventListener("submit",e=>{
 e.preventDefault();
 const c=data.find(x=>x.id===editId)||{id:uid(),notes:[]};
 Object.assign(c,{name:$("#name").value.trim(),phone:$("#phone").value.trim(),city:$("#city").value.trim(),type:$("#type").value,status:$("#status").value,follow:$("#follow").value});
 const nt=$("#note").value.trim();if(nt)c.notes.push({text:nt,date:inDays(0)});
 if(!editId)data.unshift(c);
 save();$("#dlg").close();render();
});
$("#cancel").onclick=()=>$("#dlg").close();

document.addEventListener("click",e=>{
 const nb=e.target.closest("nav button");if(nb){view=nb.dataset.v;render();return}
 if(e.target.id==="reset"){if(confirm("¿Restaurar los datos de demostración? Se perderán los cambios actuales.")){data=demo();save();render()}return}
 const b=e.target.closest("[data-a]");if(!b)return;
 const id=b.dataset.id,a=b.dataset.a,c=data.find(x=>x.id===id);
 if(a==="new")openForm(null);
 if(a==="edit")openForm(id);
 if(a==="del"&&confirm("¿Eliminar a "+c.name+"? No se puede deshacer.")){data=data.filter(x=>x.id!==id);save();render()}
 if(a==="done"){c.notes.push({text:"Seguimiento realizado.",date:inDays(0)});c.follow="";save();render()}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;render()}});
document.addEventListener("change",e=>{if(e.target.id==="fs"){fs=e.target.value;render()}if(e.target.id==="ft"){ft=e.target.value;render()}});
render();
</script>
</body>
</html>
